spring.application.name=mira-api
server.port=${SERVER_PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mira}
spring.datasource.username=${DB_USERNAME:mira}
spring.datasource.password=${DB_PASSWORD:mira_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

app.cors.allowed-origin=${FRONTEND_URL:http://localhost:3000,http://127.0.0.1:4173,http://localhost:4173,http://localhost:5173}
app.seed.enabled=${SEED_CATALOG:true}
app.auth.jwt-secret=${JWT_SECRET:mira-development-secret-change-this-before-production}
app.auth.token-expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
